# 24h public recording. No orders. live_trading stays false.
# Diversified top volume across fee categories, skip markets ending within 6 hours,
# plus up to 4 complete neg-risk events (every sibling, or the event is skipped).
# A complete event larger than the remaining max_markets cap is not cut down.
live_trading: false
universe: diversified
max_markets: 80
exclude_ending_within_s: 21600
neg_risk_event_count: 4

gamma_base: https://gamma-api.polymarket.com
clob_base: https://clob.polymarket.com
ws_market: wss://ws-subscriptions-clob.polymarket.com/ws/market

market_order: volume24hr
market_order_ascending: false
gamma_page_size: 100
gamma_max_pages: 15

ws_assets_per_connection: null
ping_interval_s: 10
reconnect_backoff_initial_s: 1
reconnect_backoff_max_s: 30
ws_stale_s: 30
backoff_reset_after_s: 30
reconcile_interval_s: 300
jsonl_flush_interval_s: 1
jsonl_flush_records: 500
rest_book_concurrency: 4
http_timeout_s: 30
http_attempts: 3
custom_feature_enabled: true
book_404_end_after: 3
gamma_refresh_interval_s: 1800

data_dir: data/day
log_level: INFO
