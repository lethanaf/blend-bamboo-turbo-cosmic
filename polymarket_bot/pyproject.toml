[project]
name = "pmbot"
version = "0.1.0"
description = "Polymarket public-data recorder. Phase 1 does not trade."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6",
    "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
